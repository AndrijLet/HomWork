{% extends "base.html" %}
{% block title %}Редагування лістингу{% endblock %}

{% block content %}
<h2>Редагувати лістинг</h2>
<form method="post">
    <label for="title">Назва:</label>
    <input type="text" id="title" name="title" value="{{ listing.title }}" required>

    <label for="description">Опис:</label>
    <textarea id="description" name="description">{{ listing.description }}</textarea>

    <label for="price">Ціна:</label>
    <input type="number" step="0.01" id="price" name="price" value="{{ listing.price }}" required>

    <button type="submit">Зберегти</button>
</form>
{% endblock %}
